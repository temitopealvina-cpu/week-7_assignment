<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/all.min.css">
   <link rel="stylesheet" href="assets/css/style.css">
    <title>Diamond Authentication</title>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
            <a href="index.html" class="back-home"><i class="fa-solid fa-arrow-left"></i>Home</a>
            <i class="fa-solid fa-diamond fa-2x"></i>
            <h2>Member login</h2>
            <p>welcome back! please enter your details to continue</p>
            </div>
            <form action="main.html" method="get" class="auth-form">
                <div class="input-group">
                <label for=""><i class="fa-solid fa-envelope"></i>email:</label>
                <input type="email" name="email" required placeholder="enter email here">
                <div class="input-group">
                <label for=""><i class="fa-solid fa-lock"></i>password</label>
                <input type="password" id="password" name="password" required placeholder="enter password">
            </div>
                <div class="from-actions">
                    <label class="remeber-me" for="">
                        <input type="checkbox" name="remeber " id="remeber"> remeber me
                    </label>
                    <a href="#"class="forgot-password">forgot password> </a>
            </div>
            <button type="submit" class="btn-submit"><i class="fa-solid fa-sign-in-alt"></i>sign in</button>
          </form>

          <div class="auth-footer">
            <p>dont have an account <a href="resgitration.html">sign up</a></p>
            
          </div>
          </div>  
        </div>

    </div>
</body>
</html>
